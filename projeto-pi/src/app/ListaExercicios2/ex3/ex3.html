<h1>Ex3</h1>

<h2>Verificação de idade</h2>

<p>Idade: {{ idade }}</p>

<button (click)="diminuirIdade()">-</button>
<button (click)="aumentarIdade()">+</button>

@if (idade < 12) {
  <p>Criança</p>
} @else if (idade >= 12 && idade <= 17) {
  <p>Adolescente</p>
} @else if (idade >= 18 && idade <= 59) {
  <p>Adulto</p>
} @else {
  <p>Idoso</p>
}
