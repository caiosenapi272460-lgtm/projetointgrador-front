<h1>Ex12</h1>
<h2>Cadastro de Produtos</h2>

<div class="formulario">

  <h3>Novo produto</h3>

  <label for="nome">
    Nome do produto:
  </label>

  <input
    id="nome"
    type="text"
    [(ngModel)]="nomeProduto"
    placeholder="Digite o nome do produto"
  >

  <label for="quantidade">
    Quantidade:
  </label>

  <input
    id="quantidade"
    type="number"
    [(ngModel)]="quantidadeProduto"
    min="0"
    placeholder="Digite a quantidade"
  >

  <button
    (click)="cadastrarProduto()"
  >
    Cadastrar
  </button>

  <p
    *ngIf="mensagemErro !== ''"
    class="erro"
  >
    {{ mensagemErro }}
  </p>

</div>

<hr>

<h2>Lista de Produtos</h2>

<div
  *ngFor="let produto of produtos"
  class="produto"
>

  <h3>{{ produto.nome }}</h3>

  <p>
    ID: {{ produto.id }}
  </p>

  <p>
    Preço:
    {{ produto.preco | currency:'BRL' }}
  </p>

  <p>
    Quantidade:
    {{ produto.quantidade }}
  </p>

  <p
    *ngIf="produto.promocao"
    class="promocao"
  >
    Produto em promoção!
  </p>

  <button
    (click)="excluirProduto(produto.id)"
    class="botao-excluir"
  >
    Excluir
  </button>

</div>
