<h1>Ex10</h1>
<h2>Produtos e Promoções</h2>

<div *ngFor="let produto of produtos" class="produto">

  <h3>{{ produto.nome }}</h3>

  <p>Quantidade em estoque: {{ produto.quantidade }}</p>

  <p [ngClass]="classeEstoque(produto.quantidade)">
    {{ classificarEstoque(produto.quantidade) }}
  </p>

  <p
    [ngStyle]="{
      'color': produto.promocao ? 'red' : 'black',
      'font-weight': produto.promocao ? 'bold' : 'normal'
    }"
  >
    Preço:
    {{ produto.preco | currency:'BRL' }}
  </p>

  <p
    *ngIf="produto.promocao"
    class="promocao"
  >
    Produto em promoção!
  </p>

  <button
    (click)="alternarPromocao(produto)"
  >
    {{ produto.promocao ? 'Desativar promoção' : 'Ativar promoção' }}
  </button>

</div>
